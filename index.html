<body>

<div class="app">

  <div class="header">📍 Kirim Lokasi Kakak 📍</div>

    <button onclick="orderOjek()">👉 Kirim Lokasi Saya 👈</button>

    <div class="notice">

      <ol>

  </div>

</div>
